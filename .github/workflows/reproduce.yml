# Reproduces the paper's numbers on every push from the published data alone: the measurements and master
# tracks from PANGAEA and the Zenodo data record (both checked against data/manifest.tsv), the cut to the legs,
# physics tests, the EC segments, placement and window-length experiments, the gridded values at the segments,
# and every printed number against expected_numbers.txt; the committed table bodies must not change.
# Figures are not rebuilt here (they need map downloads and a few minutes); `pixi run all` does that locally.
name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
      - name: Published data (PANGAEA, Zenodo; checksums) and the cut to the legs
        run: |
          pixi run fetch-pangaea
          pixi run fetch-zenodo
          pixi run inputs
      - name: Physics tests
        run: pixi run test
      - name: EC segments, placement spread, window-length experiment, Polar 6 level
        run: |
          pixi run ec-segments
          pixi run placement
          pixi run window-length
          pixi run polar6-level
      - name: Gridded values at the segments
        run: pixi run extract
      - name: Every printed number equals expected_numbers.txt
        run: pixi run check
      - name: Table bodies equal the committed ones
        run: |
          pixi run tables
          git diff --exit-code -- expected_numbers.txt tables_manuscript
