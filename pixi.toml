[workspace]
name = "bacsam-ii"
version = "1.6.0"
license = "MIT"
description = "BACSAM-II: airborne eddy-covariance and bulk sensible heat flux over Arctic sea ice (Müller et al., AMT)"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.12.*"
numpy = "*"
pandas = "*"
xarray = "*"
netcdf4 = "*"
h5netcdf = "*"
dask = "*"
bottleneck = "*"
scipy = "*"
matplotlib = "*"
cartopy = "*"
pyproj = "*"
cmocean = "*"
cmcrameri = "*"
pillow = "*"
tqdm = "*"
pytest = "*"
# only needed to open the provenance notebooks in preprocessing/
jupyter = "*"
ipykernel = "*"

# Windows consoles default to cp1252, which cannot print the scripts' unicode output.
[activation.env]
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"

[tasks]
# Each step can be run on its own; `pixi run all` runs them in order.
test          = "pytest tests -q"
# EC side: 100 Hz data -> segment fluxes, placement uncertainty, window-length experiment
verify-ec     = "python scripts/verify_ec_reproduction.py"
verify-cache  = "python scripts/verify_along_track_cache.py"
ec-segments   = "python scripts/run_ec_aggregation.py"
placement     = "python scripts/ec_segment_placement.py"
window-length = "python scripts/ec_window_length.py"
ec-quality    = { cmd = "python scripts/ec_quality.py", depends-on = ["precompute"] }
# robustness of the comparison (dependence, metrics, MODIS subset, stability, EC band)
robustness    = { cmd = "python scripts/robustness_checks.py", depends-on = ["precompute"] }
ec-bands      = { cmd = "python scripts/ec_band_sensitivity.py", depends-on = ["precompute"] }
# bulk side and paper outputs
precompute    = "python scripts/calc_bulk_and_ec_fluxes.py"
numbers       = { cmd = "python scripts/manuscript_numbers.py", depends-on = ["precompute"] }
tables        = { cmd = "python scripts/make_manuscript_tables.py", depends-on = ["precompute"] }
figures       = { cmd = "python figures_manuscript/run_all.py", depends-on = ["precompute"] }
check         = { cmd = "python scripts/check_expected_numbers.py", depends-on = ["precompute"] }
book          = { cmd = "python book/build_book.py", depends-on = ["precompute"] }
# annotated reading copy of the manuscript (needs the LaTeX source next to the repo)
paper         = "python paper/export_clean_manuscript.py"
# API reference (docs/api/) and figure pages (docs/figures/) of the website; tests/test_api_docs.py checks them
api           = "python docs/build_api.py"
all           = { depends-on = ["test", "verify-ec", "verify-cache", "check", "tables", "figures"] }
# everything from the 100 Hz data onwards (rewrites the shipped EC products; ~10 min)
all-from-raw  = { depends-on = ["test", "ec-segments", "placement", "window-length", "verify-cache", "check", "tables", "figures"] }

# ── website: the book and the docs as a static site (MyST / Jupyter Book 2) ──
# Separate environment so that the analysis environment stays lean. The notebooks are
# executed by `pixi run book`; the site build only renders them.
[feature.docs.dependencies]
mystmd = "*"

[feature.docs.tasks]
site       = "myst build --html"
site-serve = "myst start"
# password-protected deployment on Cloudflare Workers (deploy/README.md); wrangler is a local
# npm package of deploy/ (pixi run -e docs npm install --prefix deploy)
site-login  = { cmd = "node node_modules/wrangler/bin/wrangler.js login", cwd = "deploy" }
site-deploy = { cmd = "node node_modules/wrangler/bin/wrangler.js deploy", cwd = "deploy" }

[environments]
docs = { features = ["docs"], no-default-feature = true }
